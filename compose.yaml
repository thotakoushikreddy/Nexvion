services:
  nexvion:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexvion-web:1.0
    container_name: nexvion-app
    restart: unless-stopped
    ports:
      - "8090:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
